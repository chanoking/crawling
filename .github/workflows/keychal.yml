name: Keychal Ranking Automation

# 워크플로 트리거
on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때 실행
  schedule:
    - cron: "0 0 * * *" # 매일 09:00에 실행

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python 설치
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3. 의존성 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      # 4. MongoDB 연결을 로컬이 아니라 외부 또는 Atlas 사용
      #    필요하면 여기서 환경변수로 연결 정보 주입
      - name: Run scraping script
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID}}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY}}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY}}
        run: |
          python keychal/app/fetch_rank_by_blog_title.py
          python keychal/app/sponsored.py
