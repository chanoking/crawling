name: Fetch Ranking

on:
  schedule:
    # 매일 오전 9시 실행 (UTC 00:00 = KST 09:00)
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pandas playwright yagmail python-dotenv openpyxl
          playwright install --with-deps

      - name: Run fetch_rank script
        run: |
          python keychal/app/fetch_rank_by_blog_title.py
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
